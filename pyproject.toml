[project]
name = "ms2maccs"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "matchms==0.33.0",
    "numpy==2.4.6",
    "rdkit==2026.3.2",
    "tqdm==4.67.3",
    "scikit-learn>=1.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ms2maccs*"]