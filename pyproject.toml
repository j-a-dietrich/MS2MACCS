[project]
name = "ms2maccs"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "matchms==0.28.2",
    "numpy==1.24",
    "rdkit>=2024.3.5,<2025.0.0",
    "tqdm==4.65.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ms2maccs*"]